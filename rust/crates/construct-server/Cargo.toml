[package]
name = "construct-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
construct-connect = { path = "../construct-connect" }
construct-core = { path = "../construct-core" }
construct-event = { path = "../construct-event" }
construct-proto = { path = "../construct-proto" }
construct-types = { path = "../construct-types" }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
pbjson-types.workspace = true
serde_json.workspace = true
uuid = "1"

[dev-dependencies]
construct-core = { path = "../construct-core", features = ["testing"] }
tokio.workspace = true
tower.workspace = true
http-body-util.workspace = true
