[package]
name = "construct-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
construct-connect = { path = "../construct-connect" }
construct-core = { path = "../construct-core" }
construct-event = { path = "../construct-event" }
construct-proto = { path = "../construct-proto" }
construct-types = { path = "../construct-types" }
construct-secret = { path = "../construct-secret" }
construct-skill = { path = "../construct-skill" }
construct-store = { path = "../construct-store" }
libc = "0.2"
async-stream.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing = "0.1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
pbjson-types.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
construct-core = { path = "../construct-core", features = ["testing"] }
tokio = { workspace = true, features = ["process", "io-util"] }
tempfile = "3"
tower.workspace = true
http-body-util.workspace = true
