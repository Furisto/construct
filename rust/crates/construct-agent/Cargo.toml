[package]
name = "construct-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
construct-core = { path = "../construct-core" }
construct-types = { path = "../construct-types" }
construct-model = { path = "../construct-model" }
construct-secret = { path = "../construct-secret" }
construct-skill = { path = "../construct-skill" }
construct-codeact = { path = "../construct-codeact" }
construct-event = { path = "../construct-event" }
construct-store = { path = "../construct-store" }
construct-proto = { path = "../construct-proto" }
futures-util.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
reqwest.workspace = true
prometheus.workspace = true
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
construct-core = { path = "../construct-core", features = ["testing"] }
tempfile = "3"
base64 = "0.22"
axum.workspace = true
