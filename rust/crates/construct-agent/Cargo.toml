[package]
name = "construct-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
construct-core = { path = "../construct-core" }
construct-types = { path = "../construct-types" }
construct-model = { path = "../construct-model" }
construct-secret = { path = "../construct-secret" }
construct-skill = { path = "../construct-skill" }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
reqwest.workspace = true
prometheus.workspace = true
uuid = "1"
libc = "0.2"

[dev-dependencies]
construct-core = { path = "../construct-core", features = ["testing"] }
tempfile = "3"
base64 = "0.22"
axum.workspace = true
