[package]
name = "construct-skill"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
construct-types = { path = "../construct-types" }
construct-proto = { path = "../construct-proto" }
construct-connect = { path = "../construct-connect" }
pbjson-types.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
gix = { version = "0.90", default-features = false, features = ["blocking-http-transport-reqwest", "worktree-mutation", "sha1"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
regex = "1"
tempfile = "3"
thiserror = "2"
yaml-rust2 = "0.13"

[dev-dependencies]
tokio = { workspace = true, features = ["fs", "process"] }
axum.workspace = true
