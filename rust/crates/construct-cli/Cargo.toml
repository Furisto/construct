[package]
name = "construct-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "construct"

[[bin]]
name = "construct"
path = "src/main.rs"

[dependencies]
construct-connect = { path = "../construct-connect" }
construct-proto = { path = "../construct-proto" }
construct-types = { path = "../construct-types" }
clap = { version = "=4.5.54", features = ["derive"] }
tokio = { workspace = true, features = ["signal", "io-std", "process"] }
tokio-util = "0.7"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native", "vendored"] }
base64 = "0.22"
hex = "0.4"
libc = "0.2"
regex = "1"
chrono = "0.4"
thiserror = "2"
pbjson-types.workspace = true
uuid = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
url = { version = "2", features = ["serde"] }
semver = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1", features = ["crypto-rust", "vendored"] }
