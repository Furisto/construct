[package]
name = "construct-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
construct-core = { path = "../construct-core" }
construct-types = { path = "../construct-types" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
uuid = { version = "1", features = ["v4"] }
similar = "2"
globset = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util.workspace = true
readability = { version = "0.3", default-features = false }
html2md = "0.2"
tempfile = "3"

[dev-dependencies]
construct-core = { path = "../construct-core", features = ["testing"] }
