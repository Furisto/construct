[workspace]
members = ["crates/construct-proto"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
prost = "0.13"
prost-build = "0.13"
pbjson = "0.7"
pbjson-build = "0.7"
pbjson-types = "0.7"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
